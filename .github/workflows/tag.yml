# Tags a release when commits pushed to main call for one (by their
# Conventional Commits types, see scripts/next-version.sh), so pywasi has
# versions to show (pywasi.Version, the REPL's banner) and to depend on.
name: Tag

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag the release
        run: |
          tag=$(scripts/next-version.sh)
          if [ -z "$tag" ]; then
            echo "No release: no feat, fix, perf, refactor, revert or breaking commits since the last tag."
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
          echo "Tagged $tag" >> "$GITHUB_STEP_SUMMARY"
